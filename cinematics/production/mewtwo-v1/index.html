<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mewtwo — Le Projet Origine</title>
<style>html,body{margin:0;background:#070d1a;color:#ddd;font:14px system-ui}main{display:grid;place-items:center;min-height:100vh}canvas,video{width:min(100vw,1440px);height:auto;image-rendering:pixelated}[hidden]{display:none}button{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#241a3f;color:#eed6ff;border:1px solid #9b7bb4;border-radius:4px;cursor:pointer}#status{position:fixed;bottom:12px;left:16px}</style>
<main><canvas id="movie" width="960" height="540"></canvas><video id="film" controls playsinline preload="none" src="150-appearance-v1.mp4" hidden></video></main><span id="status">Préparation…</span><button id="play">Voir la cinématique · 40 s</button>
<script type="module" src="film.mjs"></script><script>document.querySelector('#play').onclick=()=>{const v=document.querySelector('#film');document.querySelector('#movie').hidden=true;v.hidden=false;document.querySelector('#play').hidden=true;v.play()};</script></html>
